name: Windows Desktop CI

on:
  push:
    branches: [master, refactor/desktop-phase6]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules (node-pty)
        run: npm run rebuild

      - name: Verify build
        run: npm run verify:build

      - name: Verify paths
        run: npm run verify:paths

      - name: Desktop layout regression
        run: node scripts/verify-desktop-layout.js

      - name: E2E smoke
        run: npm run test:e2e:windows

      - name: Package Windows portable
        run: npm run dist:win

      - name: Verify production package guard
        run: npm run verify:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: fanbox-win-exe
          path: dist/*.exe